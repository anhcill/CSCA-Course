<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background red gradient (red-600 #dc2626 to red-800 #991b1b) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Top-right amber accent glow matching Logo.jsx (-right-3 -top-3 h-7 w-7 bg-amber-300/50 blur-sm) -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#fcd34d" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle clip (rounded-2xl) -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Squircle container -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#bgGrad)" />
    <!-- Amber glow disc in top right: center ~(470, 42), radius 190 -->
    <circle cx="470" cy="42" r="190" fill="url(#amberGlow)" />
  </g>

  <!-- Lucide GraduationCap icon (stroke-based, centered, pure white) -->
  <g transform="translate(128, 128) scale(10.6667)"
     fill="none"
     stroke="#ffffff"
     stroke-width="2.2"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- Mortarboard Diamond Top -->
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
    <!-- Tassel string hanging on right -->
    <path d="M22 10v6" stroke-width="2.3" />
    <!-- Cap base / skull arch -->
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
  </g>
</svg>